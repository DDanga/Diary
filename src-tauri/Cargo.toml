[package]
name = "diary"
version = "1.10.1"
description = "A cozy, fully offline journaling app for Windows"
authors = ["Nikolai"]
license = "MIT"
repository = "https://github.com/DDanga/diary"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
